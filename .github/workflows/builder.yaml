name: Builder

env:
  MONITORED_FILES: "config.json config.yaml config.yml Dockerfile rootfs apparmor.txt translations"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Manual fallback: force a build when change detection misbehaves.
  # Leave app empty to build all apps.
  workflow_dispatch:
    inputs:
      app:
        description: "App to build (empty = all)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  init:
    name: Initialize builds
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
      changed_apps: ${{ steps.filter.outputs.changed_apps }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          # Full history: change detection diffs against the base commit,
          # which needs more than the default shallow clone on push events
          fetch-depth: 0

      - name: Get changed files
        id: changed_files
        uses: tj-actions/changed-files@v47

      - name: Find app directories
        id: apps
        uses: home-assistant/actions/helpers/find-addons@master

      - name: Filter changed apps
        id: filter
        env:
          APPS: ${{ steps.apps.outputs.addons }}
          CHANGED_FILES: ${{ steps.changed_files.outputs.all_changed_files }}
        run: |
          echo "event=${{ github.event_name }} ref=${{ github.ref }}"
          echo "APPS=${APPS}"
          echo "CHANGED_FILES=${CHANGED_FILES}"
          changed_apps=()

          # Manual run: build the requested app, or everything
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ -n "${{ inputs.app }}" ]]; then
              changed_apps=(${{ inputs.app }})
            else
              changed_apps=(${APPS})
            fi
          # If a workflow file itself changed, rebuild all apps
          elif [[ "${CHANGED_FILES}" =~ \.github/workflows/.*\.ya?ml ]]; then
            changed_apps=(${APPS})
          else
            for app in ${APPS}; do
          # Match app/<file> or app/**/<file> so nested changes
          # (e.g. rootfs/etc/.../run scripts) also trigger a rebuild.
          # Token boundaries are start/space/end: changed-files lists are
          # space-separated, so a trailing "(/|$)" misses mid-list files.
          for file in ${MONITORED_FILES}; do
            if [[ "${CHANGED_FILES}" =~ (^|[[:space:]])${app}/(.*/)?${file}(/|[[:space:]]|$) ]]; then
              changed_apps+=("${app}")
              break
            fi
          done
            done
          fi

          if [[ ${#changed_apps[@]} -gt 0 ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "changed_apps=$(jq -nc '$ARGS.positional' --args "${changed_apps[@]}")" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  build-app:
    name: Build ${{ matrix.app }}
    needs: init
    if: needs.init.outputs.changed == 'true'
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.init.outputs.changed_apps) }}
    uses: ./.github/workflows/build-app.yaml
    with:
      app: ${{ matrix.app }}
      publish: ${{ github.event_name == 'push' }}
    secrets: inherit
