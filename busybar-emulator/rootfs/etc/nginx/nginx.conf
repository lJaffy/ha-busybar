# nginx runs as root in this container: the stock Alpine config drops to the
# unprivileged "nginx" user, which cannot read root-owned keys/config or
# write the log under the app's AppArmor profile (getpwnam("nginx") fails
# when the profile hides passwd, and /var/lib/nginx/logs is root-owned).
# Docker already isolates the process; AppArmor confines what it can do.
user root;

# Log to stderr so messages land in the Supervisor log tab.
error_log stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 64;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    include /etc/nginx/http.d/*.conf;
}
