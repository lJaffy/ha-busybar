# nginx runs as root in this container: the stock Alpine config drops to the
# unprivileged "nginx" user, which cannot read root-owned keys/config or
# write the log under the app's AppArmor profile (getpwnam("nginx") fails
# when the profile hides passwd, and /var/lib/nginx/logs is root-owned).
# Docker already isolates the process; AppArmor confines what it can do.
user root;

# Log to stderr so messages land in the Supervisor log tab.
# NOTE: pass -e stderr on the command line too: nginx opens the compiled-in
# default (prefix/logs/error.log) before parsing this file, and that open
# fails under the AppArmor profile.
error_log stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 64;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    # Alpine compiles temp dirs to /var/lib/nginx/tmp/* (root-owned at
    # image build). /run is tmpfs and allowed by the profile, so point
    # them there instead; ingress/run creates the dirs on every boot.
    client_body_temp_path /run/nginx/tmp/client_body;
    proxy_temp_path /run/nginx/tmp/proxy;
    fastcgi_temp_path /run/nginx/tmp/fastcgi;
    uwsgi_temp_path /run/nginx/tmp/uwsgi;
    scgi_temp_path /run/nginx/tmp/scgi;

    include /etc/nginx/http.d/*.conf;
}
