# Minimal nginx config for the ingress window. Stays close to stock Alpine
# (user nginx, compiled-in temp paths under /var/lib/nginx): the container
# runs under Docker's default AppArmor profile, so no special paths needed.
# error_log goes to stderr so messages land in the Supervisor log tab.
user nginx;

error_log stderr warn;
pid /run/nginx/nginx.pid;

events {
    worker_connections 64;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;

    include /etc/nginx/http.d/*.conf;
}
