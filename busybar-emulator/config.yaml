name: "BUSY Bar Emulator"
slug: "busybar_emulator"
version: "0.1.7"
description: "Self-contained virtual BUSY Bar: the emulator's headless server with its HTTP API and flat window UI, controllable by the BUSY HACS integration — no physical device needed."
url: "https://github.com/lJaffy/ha-busybar/tree/main/busybar-emulator"
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto
stage: experimental
image: "ghcr.io/ljaffy/ha-busybar-emulator"
ports:
  8640/tcp: 8640
ports_description:
  8640/tcp: "Emulated BUSY Bar HTTP API (what busy-hacs and the BUSY mobile app talk to)"
webui: "http://[HOST]:[PORT:8640]/emulator"
watchdog: "http://[HOST]:[PORT:8640]/api/status/firmware"
ingress: true
ingress_port: 8099
panel_icon: mdi:monitor
panel_title: BUSY Bar Emulator
panel_admin: true
map:
  - type: data
    read_only: false
options:
  port: 8640
  firmware: latest
  log_level: info
schema:
  port: port
  firmware: list(latest|1.4.1|1.3.1)
  log_level: list(trace|debug|info|notice|warning|error|fatal)
backup: hot
homeassistant_api: false
hassio_api: false
auth_api: false
host_network: false
privileged: []
apparmor: true
homeassistant: "2026.10.0"
